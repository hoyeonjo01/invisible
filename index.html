<!DOCTYPE html>
<html lang="ko">
  <!DOCTYPE html>
  <html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
    <title>Invisible Rules</title>
  
    <!-- Web fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Noto+Serif+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
  
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="print.css" media="print">
  </head>
  
<body>
  <section id="entry-page">
    <h1 class="entry-title">Bonjour</h1>
    <input id="bonjour-input"
    class="bonjour-input"
    type="text"
    placeholder="Bonjour" type="text" autocomplete="off" spellcheck="false" autofocus />
  </section>

  <main id="main-page" class="hidden">
    <nav id="top-nav">
      <button id="meta-btn">archive</button>
      <button id="clear-images-btn">clear images</button>
      <button id="reset-view-btn">reset view</button>
      <button id="print-btn">print</button>
    </nav>

    <section id="world-viewport">
      <div id="world">
        <div id="titles-layer"></div>
        <div id="images-layer"></div>
      </div>
    </section>

    <aside id="scene-panel" class="hidden">
      <button id="close-panel">×</button>
    
      <p id="panel-id"></p>
      <p id="panel-title-ko"></p>
      <p id="panel-rule"></p>
    
      <div class="scene-title-box">
        <h2 id="panel-title"></h2>
      </div>
    
      <div class="scene-text-box">
        <p id="panel-scene"></p>
      </div>
    </aside>
  </main>

  <section id="archive-page" class="hidden">

    <div class="archive-header">
      <h1 class="archive-title">Archive</h1>
      <div class="archive-right">
        <button id="archive-print-btn">print</button>
        <button id="back-main-btn">back</button>
        <div class="archive-controls">
          <button id="sort-reset-btn">reset</button>
          <button id="sort-visibility-btn">visibility</button>
          <button id="sort-adopted-btn">adopted</button>
        </div>
      </div>
    </div><!-- ← 여기 닫는 태그가 없었던 게 핵심 원인 -->

    <div id="archive-scroll"><!-- ← 스크롤 전용 래퍼 -->
      <div id="metadata-table"></div>
    </div>

  </section>

  <script src="script.js"></script>
  <section id="print-trace"></section>
</body>
</html>
